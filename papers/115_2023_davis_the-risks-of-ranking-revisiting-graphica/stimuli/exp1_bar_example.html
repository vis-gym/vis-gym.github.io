<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stimulus: Bar chart</title>
<script src="https://cdn.jsdelivr.net/npm/d3@5.7.0/dist/d3.min.js"></script>
<style>
  body { font-family: Helvetica, Arial, sans-serif; }
  .container { width: 500px; margin: 20px auto; text-align: center; }
  svg { display: block; margin: auto; }
  .question { margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <svg id="chart" width="380" height="380"></svg>
  <div class="question">
    <p>What percentage does the smaller value represent of the larger value?</p>
    <p>(The two selected values are marked with &#9679;.)</p>
  </div>
</div>
<script>
const data = [29.4, 40, 50, 40, 70];
const selectedIndices = [0, 4]; // indices into `data` of the two marked (compared) values

function drawChart(data, selectedIndices) {
  const width = 380, height = 380;
  const margin = {left: 40, top: 20, right: 20, bottom: 20};
  const innerWidth = width - margin.left - margin.right;
  const innerHeight = height - margin.top - margin.bottom;
  const barWidth = innerWidth / data.length;
  const yScale = d3.scaleLinear().domain([0, 100]).range([innerHeight, 0]);
  const yAxis = d3.axisLeft().scale(yScale).tickValues([0, 100]);
  const svg = d3.select('#chart');

  svg.selectAll('rect').data(data).enter().append('rect')
    .style('fill', 'white').attr('stroke', 'black')
    .attr('x', (d, i) => margin.left + 10 + i * barWidth)
    .attr('y', d => margin.top + yScale(d))
    .attr('height', d => innerHeight - yScale(d))
    .attr('width', barWidth - 10);

  svg.append('g').attr('class', 'y axis')
    .attr('transform', `translate(${margin.left},${margin.top})`).call(yAxis);

  svg.selectAll('.mark').data(selectedIndices).enter().append('circle')
    .attr('class', 'mark')
    .attr('cx', d => margin.left + d * barWidth + barWidth / 2)
    .attr('cy', height - margin.bottom + 10)
    .attr('r', 3);
}

drawChart(data, selectedIndices);
</script>
</body>
</html>
