<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stimulus: Pie chart</title>
<script src="https://cdn.jsdelivr.net/npm/d3@5.7.0/dist/d3.min.js"></script>
<style>
  body { font-family: Helvetica, Arial, sans-serif; }
  .container { width: 500px; margin: 20px auto; text-align: center; }
  svg { display: block; margin: auto; }
  .question { margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <svg id="chart" width="380" height="380"></svg>
  <div class="question">
    <p>What percentage does the smaller value represent of the larger value?</p>
    <p>(The two selected values are marked with &#9679;.)</p>
  </div>
</div>
<script>
const data = [5, 25, 35, 8, 27];
const selectedIndices = [0, 3]; // indices into `data` of the two marked (compared) values

function drawChart(data, selectedIndices) {
  const width = 380, height = 380;
  const radius = Math.min(width, height) / 2 - 20;
  const pieArc = d3.arc().outerRadius(radius).innerRadius(0);
  const labelArc = d3.arc().outerRadius(radius + 10).innerRadius(radius + 10);
  const pieLayout = d3.pie().sort(null).value(d => d);
  const svg = d3.select('#chart');

  const g = svg.selectAll('.arc').data(pieLayout(data)).enter().append('g').attr('class', 'arc')
    .attr('transform', `translate(${width / 2},${height / 2})`);
  g.append('path').attr('d', pieArc).attr('stroke', 'black').attr('fill', 'white');

  g.append('circle').attr('class', 'mark')
    .attr('transform', d => `translate(${labelArc.centroid(d)})`)
    .attr('r', (d, i) => (i === selectedIndices[0] || i === selectedIndices[1]) ? 3 : 0);
}

drawChart(data, selectedIndices);
</script>
</body>
</html>
