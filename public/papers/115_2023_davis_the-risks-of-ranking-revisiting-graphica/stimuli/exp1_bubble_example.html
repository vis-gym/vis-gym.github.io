<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stimulus: Bubble chart</title>
<script src="https://cdn.jsdelivr.net/npm/d3@5.7.0/dist/d3.min.js"></script>
<style>
  body { font-family: Helvetica, Arial, sans-serif; }
  .container { width: 500px; margin: 20px auto; text-align: center; }
  svg { display: block; margin: auto; }
  .question { margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <svg id="chart" width="380" height="380"></svg>
  <div class="question">
    <p>What percentage does the smaller value represent of the larger value?</p>
    <p>(The two selected values are marked with &#9679;.)</p>
  </div>
</div>
<script>
const data = [15, 15, 14.8, 20, 38];
const selectedIndices = [2, 3]; // indices into `data` of the two marked (compared) values

function drawChart(data, selectedIndices) {
  const width = 380, height = 380;
  const jsonData = {children: data.map(d => ({value: d}))};
  const svg = d3.select('#chart');

  const bubble = d3.pack(jsonData).size([width - 10, height - 10]).padding(1.5);
  const bubbleNodes = d3.hierarchy(jsonData).sum(d => d.value);
  const bubbleData = bubble(bubbleNodes).descendants().filter(d => !d.children);

  svg.selectAll('.bubble').data(bubbleData).enter().append('circle')
    .attr('class', 'bubble')
    .attr('cx', d => d.x).attr('cy', d => d.y).attr('r', d => d.r)
    .style('fill', 'white').attr('stroke', 'black');

  svg.selectAll('.mark').data(bubbleData).enter().append('circle')
    .attr('class', 'mark')
    .attr('cx', d => d.x).attr('cy', d => d.y)
    .attr('r', (d, i) => (i === selectedIndices[0] || i === selectedIndices[1]) ? 3 : 0);
}

drawChart(data, selectedIndices);
</script>
</body>
</html>
