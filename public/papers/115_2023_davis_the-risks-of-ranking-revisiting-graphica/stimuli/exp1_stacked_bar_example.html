<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stimulus: Stacked bar chart</title>
<script src="https://cdn.jsdelivr.net/npm/d3@5.7.0/dist/d3.min.js"></script>
<style>
  body { font-family: Helvetica, Arial, sans-serif; }
  .container { width: 500px; margin: 20px auto; text-align: center; }
  svg { display: block; margin: auto; }
  .question { margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <svg id="chart" width="380" height="380"></svg>
  <div class="question">
    <p>What percentage does the smaller value represent of the larger value?</p>
    <p>(The two selected values are marked with &#9679;.)</p>
  </div>
</div>
<script>
const data = [20, 17, 20, 61, 30];
const selectedIndices = [0, 2]; // indices into `data` of the two marked (compared) values

function drawChart(data, selectedIndices) {
  const width = 380, height = 380;
  const margin = {left: 40, top: 20, right: 20, bottom: 20};
  const innerHeight = height - margin.top - margin.bottom;
  const sumOfData = data.reduce((a, b) => Number(a) + Number(b));
  const dividend = sumOfData / 100;
  const obj1 = {col: 'A'};
  for (let i = 0; i < data.length; i++) obj1[String.fromCharCode(i + 65)] = data[i] / dividend;
  const series = d3.stack().keys(['A', 'B', 'C', 'D', 'E'])([obj1]);
  const yScale = d3.scaleLinear().domain([0, 100]).range([innerHeight, 0]);
  const yAxis = d3.axisLeft().scale(yScale).tickValues([0, 100]);
  const barWidth = Math.min(width, height) / 2 - 20;
  const barHorizontalOffset = 90;
  const svg = d3.select('#chart');

  svg.selectAll('rect').data(series).enter().append('g')
    .attr('class', 'bargroup')
    .selectAll('rect').data(d => d).enter().append('rect')
    .attr('width', barWidth - 30)
    .attr('x', (d, i) => margin.left + barHorizontalOffset)
    .attr('y', d => margin.top + yScale(d[1]))
    .attr('height', d => yScale(d[0]) - yScale(d[1]))
    .style('fill', 'white').attr('stroke', 'black');

  svg.append('g').attr('class', 'y axis')
    .attr('transform', `translate(${margin.left},${margin.top})`).call(yAxis);

  const selectedMap = [1, 2, 3, 4, 5];
  let current = 0;
  svg.selectAll('.mark').data(series).enter().append('g').attr('class', 'mark')
    .selectAll('.mark').data(d => d).enter().append('circle')
    .attr('cx', margin.left + 0.5 * barWidth + barHorizontalOffset)
    .attr('cy', d => margin.top + yScale(d[1]) + 0.5 * (yScale(d[0]) - yScale(d[1])))
    .attr('r', () => {
      current++;
      return (current === selectedMap[selectedIndices[0]] || current === selectedMap[selectedIndices[1]]) ? 3 : 0;
    });
}

drawChart(data, selectedIndices);
</script>
</body>
</html>
